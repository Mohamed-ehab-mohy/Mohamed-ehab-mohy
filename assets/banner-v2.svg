<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient matching website -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="50%" stop-color="#131b2f"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>

    <!-- Accent gradient (brand gradient) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#06b6d4;#10b981" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="33%" stop-color="#06b6d4"/>
      <stop offset="66%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#0ea5e9;#6366f1" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Line gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="30%" stop-color="#06b6d4" stop-opacity="1"/>
      <stop offset="70%" stop-color="#0ea5e9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow effects -->
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
    </pattern>

    <!-- Dot pattern -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#0ea5e9" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>

  <!-- Glowing orbs -->
  <circle cx="1000" cy="80" r="200" fill="url(#glow1)">
    <animate attributeName="r" values="180;220;180" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="1000;1020;1000" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="260" r="160" fill="url(#glow2)">
    <animate attributeName="r" values="140;180;140" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="260;240;260" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="30" r="100" fill="url(#glow1)">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated particle lines -->
  <line x1="0" y1="200" x2="300" y2="180" stroke="#06b6d4" stroke-width="0.5" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="900" y1="50" x2="1200" y2="70" stroke="#0ea5e9" stroke-width="0.5" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </line>
  <line x1="400" y1="280" x2="800" y2="260" stroke="#6366f1" stroke-width="0.5" opacity="0.15">
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="5s" repeatCount="indefinite"/>
  </line>

  <!-- Floating code symbols -->
  <text x="1060" y="60" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="28" fill="#10b981" opacity="0.5">
    &lt;/&gt;
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="50" y="55" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="22" fill="#06b6d4" opacity="0.4">
    { }
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 10; 0 0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="1100" y="200" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="18" fill="#0ea5e9" opacity="0.3">
    async
    <animateTransform attributeName="transform" type="translate" values="0 0; -8 0; 0 0" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="30" y="220" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="16" fill="#6366f1" opacity="0.25">
    var
    <animateTransform attributeName="transform" type="translate" values="0 0; 6 0; 0 0" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="40" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="14" fill="#0ea5e9" opacity="0.2">
    .NET 10
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 5; 0 0" dur="7s" repeatCount="indefinite"/>
  </text>

  <!-- Decorative hexagon outlines -->
  <polygon points="1120,250 1140,240 1160,250 1160,270 1140,280 1120,270" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.2">
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 1140 260;360 1140 260" dur="20s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="80,120 100,110 120,120 120,140 100,150 80,140" fill="none" stroke="#0ea5e9" stroke-width="0.6" opacity="0.15">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="360 100 130;0 100 130" dur="25s" repeatCount="indefinite"/>
  </polygon>

  <!-- Profile Image / Logo Background -->
  <rect x="60" y="100" width="80" height="80" rx="40" fill="#131b2f" stroke="url(#accentGrad)" stroke-width="2"/>
  
  <image href="http://mohamed-ehab-mohy-backend.vercel.app/icon-backend.png" x="70" y="110" width="60" height="60" />

  <!-- Name -->
  <text x="160" y="140" font-family="Inter, Outfit, Segoe UI, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
    Mohamed Ehab 
    <tspan fill="url(#accentGrad)">Mohy El-Din</tspan>
  </text>

  <!-- Role badge -->
  <rect x="160" y="155" width="450" height="32" rx="16" fill="#0ea5e9" opacity="0.12"/>
  <text x="176" y="177" font-family="Inter, Outfit, Segoe UI, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#0ea5e9">
    .NET Backend Developer  ·  Clean Architecture  ·  ASP.NET Core
  </text>

  <!-- Animated underline -->
  <rect x="160" y="200" width="0" height="2.5" rx="1.25" fill="url(#lineGrad)">
    <animate attributeName="width" values="0;550;550;0" keyTimes="0;0.35;0.85;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Tagline -->
  <text x="160" y="235" font-family="Inter, Outfit, Segoe UI, Helvetica, sans-serif" font-size="17" fill="#94a3b8" font-weight="400">
    Architecting multi-tenant SaaS platforms &amp; event-driven microservices.
  </text>

  <!-- Status indicator -->
  <circle cx="174" cy="265" r="5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="188" y="270" font-family="Inter, Outfit, Segoe UI, Helvetica, sans-serif" font-size="14" fill="#10b981" font-weight="500">
    Open to Relocate (Cairo) / Remote
  </text>

  <!-- Bottom accent bar -->
  <rect x="0" y="316" width="1200" height="4" fill="url(#accentGrad)"/>
</svg>
